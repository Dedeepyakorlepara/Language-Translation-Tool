
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translation Tool</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Language Translator</h1>
        <p class="subtitle">Translate text into your favorite language</p>

        <div class="translator">

            <div class="language-select">
                <button onclick="swapLanguages()">⇄ Swap</button>
                <div>
                    <label>From Language</label>
                    <select id="sourceLanguage">
                        <option value="en">English</option>
                        <option value="te">Telugu</option>
                        <option value="hi">Hindi</option>
                        <option value="ta">Tamil</option>
                        <option value="kn">Kannada</option>
                        <option value="ml">Malayalam</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="es">Spanish</option>
                        <option value="ja">Japanese</option>
                        <option value="zh">Chinese</option>
                        <option value="ar">Arabic</option>
                    </select>
                </div>

                <div>
                    <label>To Language</label>
                    <select id="targetLanguage">
                        <option value="en">English</option>
                        <option value="te">Telugu</option>
                        <option value="hi">Hindi</option>
                        <option value="ta">Tamil</option>
                        <option value="kn">Kannada</option>
                        <option value="ml">Malayalam</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="es">Spanish</option>
                        <option value="ja">Japanese</option>
                        <option value="zh">Chinese</option>
                        <option value="ar">Arabic</option>
                    </select>
                </div>
            </div>

            <div class="text-area">
                <textarea id="inputText"
                    placeholder="Enter text to translate..."></textarea>

                <textarea id="outputText"
                    placeholder="Translation will appear here..."
                    readonly></textarea>
            </div>

            <button id="translateBtn" onclick="translateText()">
                Translate
            </button>

            <button id="copyBtn" onclick="copyText()">
                Copy Translation
            </button>

            <p id="message"></p>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
